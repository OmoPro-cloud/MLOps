version: '3.8'

services:
  # 1. Your ML API
  ml_api:
    build: .
    ports:
      - "8000:8000"

  # 2. Prometheus (The Database)
  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  # 3. Grafana (The Dashboard)
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"