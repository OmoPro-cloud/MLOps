services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: flask-mobilenet:1.1
    container_name: mobilenet_app
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=prod
    volumes:
      - ./data/uploads:/app/uploads
      - keras_cache:/home/appuser/.keras
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
  
volumes:
  keras_cache:
networks:
  app_net:
    driver: bridge